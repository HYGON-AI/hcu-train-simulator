name: PR Test K8s

on:
  pull_request_target:
    branches: [main]
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-test-k8s-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulation-st:
    name: Simulation ST K8s
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci-hcu'
    runs-on: hygon-build
    timeout-minutes: 20
    container:
      # Preloaded and verified on nmz1/2/3/4/6; do not publish or retag here.
      # Non-latest tag uses Kubernetes' default IfNotPresent pull policy.
      image: hcu-train-simulator:1.0.0
    env:
      CI_TEST_IMAGE: hcu-train-simulator:1.0.0
      CI_TESTED_REVISION: ${{ github.event_name == 'workflow_dispatch' && github.sha || format('refs/pull/{0}/merge', github.event.pull_request.number) }}
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # For PRs, test the merge revision rather than the base branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || format('refs/pull/{0}/merge', github.event.pull_request.number) }}
          persist-credentials: false

      - name: Run simulation tests
        run: |
          set -euo pipefail
          test "${HCU_CI_IN_K8S:-}" = "1"
          mkdir -p ci_artifacts
          python .github/scripts/run_simulation_tests.py 2>&1 | tee ci_artifacts/unittest.log

      - name: Upload simulation test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: simulator-k8s-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci_artifacts/
          if-no-files-found: warn
          retention-days: 7

  cleanup-label:
    name: Cleanup CI label
    if: ${{ always() && github.event_name == 'pull_request_target' && github.event.label.name == 'ci-hcu' }}
    needs: simulation-st
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Remove ci-hcu label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/labels/ci-hcu")
          [[ "${status}" == 200 || "${status}" == 404 ]]
