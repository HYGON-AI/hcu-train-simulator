name: PR Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mla-mtp-simulation:
    name: MLA/MTP simulation
    runs-on: [self-hosted, Linux, X64, ci, nmz3, bw1100]
    timeout-minutes: 10
    env:
      TEST_IMAGE: hcu-train-simulator:1.0.0
      TEST_CONTAINER: >-
        hcu-train-simulator-pr-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Check test image
        run: docker image inspect "$TEST_IMAGE" >/dev/null

      - name: Run MLA/MTP simulation tests
        run: |
          docker run --rm \
            --name "$TEST_CONTAINER" \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --memory 4g \
            --memory-swap 4g \
            --cpus 4 \
            --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,size=512m \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            --env HOME=/tmp \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONPATH=/workspace/src \
            "$TEST_IMAGE" \
            python -m unittest tests.st.test_mla_mtp_simulation -v

      - name: Cleanup test container
        if: always()
        run: docker rm --force "$TEST_CONTAINER" >/dev/null 2>&1 || true
